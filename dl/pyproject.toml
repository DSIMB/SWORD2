[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sword2-dl"
version = "0.1.0"
description = "Deep learning model for protein domain partitioning from sequence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "torch>=2.0",
    "safetensors>=0.4",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "wandb>=0.15",
    "biopython>=1.81",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1",
]
# Only needed for on-the-fly embedding computation (not required for training)
esm = [
    "fair-esm>=2.0",
]
# Web server dependencies
server = [
    "fastapi>=0.100",
    "uvicorn>=0.22",
]

[project.scripts]
sword2-dl-train = "sword2_dl.train:main"
sword2-dl-predict = "sword2_dl.predict:main"
sword2-dl-generate = "sword2_dl.generate_data:main"
sword2-dl-pipeline = "sword2_dl.pipeline:main"
sword2-dl-benchmark = "sword2_dl.benchmark:main"
sword2-dl-server = "sword2_dl.server:main"

[tool.setuptools.packages.find]
include = ["sword2_dl*"]

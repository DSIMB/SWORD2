# Default config: concatenate all 3 PLM embeddings
model:
  embedding_sources:
    - name: "esm2_650M"
      embed_dim: 2560
      path: "/dsimb/iceberg/cretin/DATABASES/SWISSPROT/esm2_t36_3b_ur50d"
    - name: "ankh2_large"
      embed_dim: 1536
      path: "/dsimb/iceberg/cretin/DATABASES/SWISSPROT/ankh_large"

  pair_dim: 128
  pair_num_blocks: 8
  pair_kernel_size: 3
  pair_dilation_cycle: [1, 2, 4, 8]
  pair_dropout: 0.1
  single_dim: 256
  single_num_layers: 4
  single_num_heads: 8
  single_dropout: 0.1
  num_partitioning_slots: 10
  head_hidden_dim: 64
  predict_num_domains: true
  predict_boundaries: true
  predict_contact_map: true
  max_num_domains: 20
  num_triangle_blocks: 2
  use_multiscale: true
  num_scales: 2
  use_slot_attention: true
  slot_dim: 128
  slot_iters: 3

data:
  sword2_binary: "/home/chili/cretin/PROJECTS/SWORD2/target/release/sword2"
  swissprot_fasta: "/home/chili/cretin/PROJECTS/embeddings-compression/DATA/swissprot_dataset/all_filt_len_2048.fasta"
  sword2_output_dir: "/home/chili/cretin/PROJECTS/SWORD2/data/sword2_results"
  processed_data_dir: "/home/chili/cretin/PROJECTS/SWORD2/data/processed"
  max_seq_len: 1024
  min_seq_len: 15
  min_num_partitionings: 1
  train_split: 0.9
  val_split: 0.05
  batch_size: 8
  num_workers: 4
  pin_memory: true

train:
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  max_steps: 200000
  gradient_clip: 1.0
  co_membership_weight: 1.0
  confidence_weight: 0.1
  num_domains_weight: 0.1
  boundary_weight: 0.5
  contact_map_weight: 0.5
  dice_weight: 0.5
  boundary_smooth_width: 2
  use_ema: true
  ema_decay: 0.999
  fp16: true
  gradient_accumulation: 4
  eval_every: 1000
  save_every: 5000
  log_every: 50
  output_dir: "checkpoints"
  wandb_project: "sword3"

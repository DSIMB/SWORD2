# Small model config for testing and development
model:
  esm_model: "esm2_t6_8M_UR50D"
  esm_embed_dim: 320
  freeze_esm_layers: 4
  pair_dim: 64
  pair_num_blocks: 4
  pair_kernel_size: 3
  pair_dilation_cycle: [1, 2, 4, 8]
  pair_dropout: 0.1
  single_dim: 128
  single_num_layers: 2
  single_num_heads: 4
  single_dropout: 0.1
  num_partitioning_slots: 5
  head_hidden_dim: 32
  predict_num_domains: true
  predict_boundaries: true
  max_num_domains: 20

data:
  max_seq_len: 512
  min_seq_len: 30
  batch_size: 8
  num_workers: 2

train:
  learning_rate: 3.0e-4
  esm_learning_rate: 3.0e-5
  warmup_steps: 200
  max_steps: 20000
  gradient_accumulation: 2
  eval_every: 500
  save_every: 2000
  wandb_project: "sword2-dl-dev"

# Small config: single PLM for fast development
model:
  embedding_sources:
    - name: "esm2_650M"
      embed_dim: 1280
      path: "data/embeddings/esm2_650M"

  pair_dim: 64
  pair_num_blocks: 4
  pair_kernel_size: 3
  pair_dilation_cycle: [1, 2, 4, 8]
  pair_dropout: 0.1
  single_dim: 128
  single_num_layers: 2
  single_num_heads: 4
  single_dropout: 0.1
  num_partitioning_slots: 5
  head_hidden_dim: 32
  predict_num_domains: true
  predict_boundaries: true
  predict_contact_map: true
  max_num_domains: 20
  num_triangle_blocks: 1
  use_multiscale: false
  use_slot_attention: true
  slot_dim: 64
  slot_iters: 2

data:
  max_seq_len: 512
  min_seq_len: 30
  batch_size: 16
  num_workers: 2

train:
  learning_rate: 3.0e-4
  warmup_steps: 200
  max_steps: 20000
  gradient_accumulation: 2
  eval_every: 500
  save_every: 2000
  wandb_project: "sword3-dev"
